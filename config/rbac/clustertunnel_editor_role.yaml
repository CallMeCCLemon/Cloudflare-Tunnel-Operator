# This rule is not used by the project cloudflare-tunnel-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the tunnels.latentlab.cc.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cloudflare-tunnel-operator
    app.kubernetes.io/managed-by: kustomize
  name: clustertunnel-editor-role
rules:
- apiGroups:
  - tunnels.latentlab.cc
  resources:
  - clustertunnels
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - tunnels.latentlab.cc
  resources:
  - clustertunnels/status
  verbs:
  - get
