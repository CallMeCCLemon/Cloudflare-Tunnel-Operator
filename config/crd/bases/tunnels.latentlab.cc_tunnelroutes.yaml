    - jsonPath: .status.serviceUrl
      name: Service
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: TunnelRoute publishes a hostname through a ClusterTunnel to a
          Service in this namespace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TunnelRouteSpec defines the desired state of TunnelRoute.
            properties:
              adoptExistingDnsRecord:
                description: |-
                  AdoptExistingDNSRecord lets the operator take over a CNAME for this hostname
                  that it did not create (for example one made by the dashboard during migration).
                type: boolean
              hostname:
                description: Hostname to publish, e.g. app.latentlab.cc. Must be in
                  the tunnel's zone.
                pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?\.)+[a-z]{2,}$
                type: string
              originRequest:
                description: OriginRequest mirrors the subset of cloudflared's originRequest
                  settings we expose.
                properties:
                  http2Origin:
                    description: HTTP2Origin makes cloudflared speak HTTP/2 to the
                      origin (needed for gRPC; requires https).
                    type: boolean
                  httpHostHeader:
                    description: HTTPHostHeader overrides the Host header sent to
                      the origin.
                    type: string
                  noTLSVerify:
                    description: NoTLSVerify disables TLS verification of the origin
                      (for self-signed https Services).
                    type: boolean
                  originServerName:
                    description: OriginServerName overrides the TLS SNI hostname sent
                      to the origin.
                    type: string
                type: object
              path:
                description: Path is an optional regex matched against the request
                  path.
                type: string
              service:
