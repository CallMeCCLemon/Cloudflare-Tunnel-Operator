                properties:
                  name:
                    description: Name of the Service.
                    minLength: 1
                    type: string
                  port:
                    description: Port number on the Service.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  scheme:
                    default: http
                    description: Scheme cloudflared uses to reach the Service.
                    enum:
                    - http
                    - https
                    type: string
                required:
                - name
                - port
                type: object
              tunnelRef:
                description: TunnelReference names the ClusterTunnel a route attaches
