              dnsRecordId:
                description: DNSRecordID is the Cloudflare DNS record managed for
                  this route.
                type: string
              observedGeneration:
                format: int64
                type: integer
              serviceUrl:
                description: ServiceURL is the in-cluster URL cloudflared forwards
                  to.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
