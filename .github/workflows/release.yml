name: Release

# Push a semver tag (v0.1.0, v0.2.0-rc.1, ...) to publish:
#   - a multi-arch image to ghcr.io/callmecclemon/cloudflare-tunnel-operator
#   - a GitHub Release with dist/install.yaml pinned to that image's digest
# Deploying stays manual: `kubectl apply -f install.yaml` or `make deploy IMG=...`.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/callmecclemon/cloudflare-tunnel-operator

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: make test

      - name: Run linter
        run: make lint

  release:
    name: Build, push and publish
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      packages: write # push to GHCR
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # No QEMU needed: the Dockerfile cross-compiles on the runner's platform and
      # the final stage only copies the binary.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # v1.2.3 -> 1.2.3, 1.2 and latest; pre-releases (v1.2.3-rc.1) only get their own tag.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Render install.yaml pinned to the image digest
        run: make build-installer IMG="${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.meta.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          prerelease=""
          [[ "$TAG" == *-* ]] && prerelease="--prerelease"
          cat > notes.md <<EOF
          ## Image

          \`${IMAGE}:${VERSION}\`
          \`${IMAGE}@${DIGEST}\`

          ## Install or upgrade

          \`\`\`sh
          kubectl apply -f https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/install.yaml
          \`\`\`
          EOF
          gh release create "$TAG" dist/install.yaml \
            --title "$TAG" --notes-file notes.md --generate-notes --verify-tag $prerelease
